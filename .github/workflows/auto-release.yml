name: Auto Release

# Automatic versioning + changelog from your commit messages (Conventional
# Commits). Every push to main is analyzed; if it warrants a release it:
#   1. bumps the version (vX.Y.Z),
#   2. writes/updates CHANGELOG.md and commits it back ([skip ci]),
#   3. creates the tag, and
#   4. dispatches release.yml ON that tag, which packages + uploads to CurseForge.
# (We dispatch instead of packaging here because the packager skips a branch push
#  whose HEAD is tagged — "Found future tag" — and GITHUB_TOKEN-pushed tags don't
#  trigger the tag workflow. A workflow_dispatch run isn't a "push", so it builds.)
# No manual tagging needed.
#
#   fix: ...                          -> patch   (1.2.3 -> 1.2.4)
#   feat: ...                         -> minor   (1.2.3 -> 1.3.0)
#   feat!: ...  /  "BREAKING CHANGE:" -> major   (1.2.3 -> 2.0.0)
#   docs/chore/refactor/style/test    -> no release (keeps the changelog clean)
#   message contains [skip ci]        -> no release
#
# Want a release on *every* push instead? set skip-on-empty to 'false' below.

on:
  push:
    branches: [ main ]

permissions:
  contents: write   # commit CHANGELOG.md, create the tag + GitHub release
  actions: write    # dispatch release.yml to package the new tag

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bump + changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # {version} já inclui o tag-prefix "v"; a action anexa [skip ci] sozinha.
          # (não pré-fixe outro "v" nem outro [skip ci] — vira "vv..." e "[skip ci] [skip ci]")
          git-message: "chore(release): {version}"
          git-user-name: "github-actions[bot]"
          git-user-email: "github-actions[bot]@users.noreply.github.com"
          preset: "conventionalcommits"
          tag-prefix: "v"
          output-file: "CHANGELOG.md"
          release-count: "1"        # prepend only the new version (keeps history)
          skip-version-file: "true" # no package.json — the .toc uses @project-version@
          skip-on-empty: "true"     # no conventional commits -> no release

      # Hand off packaging to release.yml, dispatched ON the new tag. Because a
      # workflow_dispatch run's event name isn't "push", the packager's
      # "Found future tag" guard never fires and it builds the tag cleanly.
      - name: Package the new tag (dispatch Release workflow)
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.changelog.outputs.tag }}"
